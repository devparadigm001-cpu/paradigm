[package]
name = "paradigm"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "paradigm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
getrandom = "0.4.3"
zeroize = "1.9.0"
thiserror = "2.0.19"
terminator-rs = "0.23.35"
terminator-workflow-recorder = "0.23.35"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3.33"
llama-cpp-2 = "0.1.153"
encoding_rs = "0.8.35"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
# Probes only. terminator-workflow-recorder reports its text-input decisions
# through `tracing`; without a subscriber those messages go nowhere, which is
# why the truncation defect was opaque for so long.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

